<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-labelledby="mark-title mark-desc">
  <title id="mark-title">Threadspan</title>
  <desc id="mark-desc">One task enters a live selector and continues through a primary or fallback route.</desc>
  <g id="routing-gate" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path id="route-input" stroke="#1B1814" stroke-width="3.2" d="M3.5 16h8.5"/>
    <circle id="route-selector" cx="15.5" cy="16" r="3.35" stroke="#8A3F24" stroke-width="3"/>
    <path id="route-primary" stroke="#165E66" stroke-width="3.2" d="M18.5 13.4 23 8h5.5"/>
    <path id="route-fallback" stroke="#8A3F24" stroke-width="3.2" d="M18.5 18.6 23 24h5.5"/>
  </g>
</svg>
